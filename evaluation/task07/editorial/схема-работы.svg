<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Как агент исследует задачу и сохраняет память</title>
  <desc id="desc">Запрос руководителя проходит через Codex, инструменты и проверенные основания к стратегии и решению человека. Память хранит версии и следующий шаг, новые сведения вызывают пересмотр.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#47717c"/></marker></defs>
  <rect width="1100" height="310" fill="white"/>
  <g fill="#edf5f5" stroke="#93b4b9" stroke-width="1.5">
    <rect x="8" y="24" width="168" height="92" rx="12"/>
    <rect x="206" y="24" width="194" height="92" rx="12"/>
    <rect x="430" y="24" width="206" height="92" rx="12"/>
    <rect x="666" y="24" width="192" height="92" rx="12"/>
    <rect x="888" y="24" width="204" height="92" rx="12"/>
    <rect x="206" y="175" width="652" height="86" rx="12" fill="#f6f2e9" stroke="#c7b68e"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#173e48" text-anchor="middle">
    <g font-size="19" font-weight="bold">
      <text x="92" y="58">Запрос</text><text x="92" y="83">руководителя</text>
      <text x="303" y="58">Codex</text>
      <text x="533" y="58">Инструменты</text>
      <text x="762" y="58">Проверенные</text><text x="762" y="83">основания</text>
      <text x="990" y="58">Стратегии</text><text x="990" y="83">и план проверки</text>
      <text x="532" y="207">Память проекта</text>
    </g>
    <g font-size="16">
      <text x="303" y="84">выбор следующего шага</text>
      <text x="533" y="83">файлы · Python · сайты</text>
      <text x="532" y="236">версии источников · расчёты · решения · следующий шаг</text>
      <text x="990" y="162" font-weight="bold">Решение человека</text>
      <text x="92" y="212">Новые сведения</text><text x="92" y="236">или перерыв</text>
      <text x="532" y="295" font-size="15" fill="#526d73">Проверка файлов перед сохранением. Предыдущие версии остаются доступны.</text>
    </g>
  </g>
  <g fill="none" stroke="#47717c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M176 70 H199"/><path d="M400 70 H423"/><path d="M636 70 H659"/><path d="M858 70 H881"/>
    <path d="M990 116 V139"/>
    <path d="M990 174 V218 H865"/>
    <path d="M762 116 V168"/>
    <path d="M303 175 V123"/>
    <path d="M176 219 H199"/>
  </g>
  <g fill="#47717c">
    <polygon points="199,70 190,65 190,75"/>
    <polygon points="423,70 414,65 414,75"/>
    <polygon points="659,70 650,65 650,75"/>
    <polygon points="881,70 872,65 872,75"/>
    <polygon points="990,139 985,130 995,130"/>
    <polygon points="865,218 874,213 874,223"/>
    <polygon points="762,168 757,159 767,159"/>
    <polygon points="303,123 298,132 308,132"/>
    <polygon points="199,219 190,214 190,224"/>
  </g>
</svg>
